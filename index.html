<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollegePadel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      color: #172334;
    }
    header {
      background: #123b35;
      color: white;
      padding: 24px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #123b35;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎾 CollegePadel</h1>
    <p>Padel for kollegaer</p>
  </header>

  <main>
    <div class="card">
      <h2>Velkommen til CollegePadel</h2>
      <p>
        Her kan vi snart arrangere kampe,
        tilmelde spillere og holde styr på
        vores padelaktiviteter.
      </p>

      <h3>Kommende kampe</h3>
      <p>Ingen kampe oprettet endnu.</p>

      <button onclick="alert('Kampoprettelse kommer i næste version')">
        Opret kamp
      </button>
    </div>
  </main>
</body>
</html>
